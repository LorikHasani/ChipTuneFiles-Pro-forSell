version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./uploads:/app/server/uploads
    # Note: SQL Server runs on the host machine (not in Docker).
    # Use host.docker.internal to connect from container to host SQL Server.
    # DATABASE_URL example for Docker:
    #   sqlserver://host.docker.internal;database=chiptunefiles;user=sa;password=YourPassword;trustServerCertificate=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
